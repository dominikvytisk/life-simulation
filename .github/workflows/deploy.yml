name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and tests gate the deploy. The simulation suite is the part
      # worth gating on: a determinism regression is invisible in a screenshot.
      - run: npx tsc -b
      - run: npm test

      - name: Build
        # A project site lives under /<repo>/, so the base path has to match the
        # repository name or every asset and worker chunk 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages serves the built directory as-is and does no SPA
      # rewriting. This app is a single route so that does not matter, but a
      # 404.html copy means a stray deep link still loads rather than showing
      # GitHub's error page.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
